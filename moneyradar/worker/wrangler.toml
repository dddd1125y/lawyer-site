# 머니레이더 결제 승인 서버 설정
# 배포:  npx wrangler deploy
name = "moneyradar-pay"
main = "src/index.js"
compatibility_date = "2025-07-01"

# 결제 결과를 담는 D1 데이터베이스
# 먼저 만들고:  npx wrangler d1 create moneyradar
# 출력된 database_id 를 아래에 붙여넣으세요.
[[d1_databases]]
binding = "DB"
database_name = "moneyradar"
database_id = "여기에_database_id를_붙여넣으세요"

[vars]
# 이 주소에서 오는 요청만 허용합니다. 쉼표로 여러 개 지정할 수 있습니다.
ALLOWED_ORIGIN = "https://dddd1125y.github.io"

# 시크릿 키는 절대 이 파일에 쓰지 마세요. 아래 명령으로 따로 넣습니다.
#   npx wrangler secret put TOSS_SECRET_KEY
